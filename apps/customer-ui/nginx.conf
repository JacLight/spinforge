server {
    listen ${NGINX_LISTEN_PORT};
    server_name _;

    # Allow file uploads up to 100MB
    client_max_body_size 100M;

    # Increase buffer sizes for large headers/cookies
    large_client_header_buffers 4 32k;
    client_header_buffer_size 32k;

    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml application/atom+xml image/svg+xml;

    # Proxy API requests to the backend. The upstream is injected at
    # container start time via the API_UPSTREAM env var (e.g.
    # `api.service.consul:8080` when running under Nomad, or `api:8080`
    # when on the docker-compose spinforge network).
    #
    # Using a variable + resolver forces nginx to re-resolve DNS at
    # request time — required when the upstream is behind Consul DNS and
    # the IP can change as allocations move.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;

    location ~ ^/(_admin|_api|_auth|_metrics|api)/ {
        set $upstream_api ${API_UPSTREAM};
        proxy_pass http://$upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # WebSocket support
        proxy_read_timeout 86400;
    }

    # Vite fingerprints these, so the filename changes whenever the
    # content does — they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html must be revalidated on every load. It carries no
    # fingerprint of its own but names the fingerprinted bundles, so a
    # cached copy pins the browser to the previous deploy's assets — which
    # made shipped changes simply not appear until the browser happened to
    # revalidate. No cache headers at all meant heuristic caching decided
    # for us.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Handle client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}

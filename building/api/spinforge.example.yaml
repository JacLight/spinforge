# SpinForge deployment manifest
#
# Download this pre-filled from your dashboard: open the app, then
# "Download manifest". Commit it to your repository root.
#
# Deploy on every push:
#   curl -X POST https://build.spinforge.dev/_api/customer/manifest \
#        -H "Authorization: Bearer $SPINFORGE_TOKEN" \
#        -H "Content-Type: application/yaml" \
#        --data-binary @spinforge.yaml
#
# The app must already exist — create it in the dashboard first. A manifest
# points at an app you own; it can never create one or claim a domain.
#
# appId is stable: changing the app's domain does not invalidate this file.

appId: app_b5354edd-e287-480f-b750-72b28a39a255

repo:
  url: https://github.com/me/my-app
  # ref: main           # default: the repository's default branch
  # token: ghp_xxx      # private repos only

# rootDir: apps/web     # subdirectory holding this project, for monorepos
# autoDeploy: true      # false = save configuration without building
